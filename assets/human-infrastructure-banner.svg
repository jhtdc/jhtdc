    <path d="M70 264H1130" stroke="#C7D2FE"/>
    <path d="M188 52V308" stroke="#C7D2FE"/>
    <path d="M384 52V308" stroke="#C7D2FE"/>
    <path d="M600 52V308" stroke="#C7D2FE"/>
    <path d="M816 52V308" stroke="#C7D2FE"/>
    <path d="M1012 52V308" stroke="#C7D2FE"/>
  </g>

  <g opacity="0.72">
    <path d="M160 238C273 122 380 118 492 184C611 254 713 250 826 140C910 58 1016 74 1080 116" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M160 238C273 122 380 118 492 184C611 254 713 250 826 140C910 58 1016 74 1080 116" stroke="url(#line)" stroke-width="9" stroke-linecap="round" opacity="0.14"/>
  </g>

