  </g>

  <g fill="#E5E7EB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="76" y="84" font-size="14" opacity="0.54">systems</text>
    <text x="226" y="246" font-size="14" opacity="0.54">care</text>
    <text x="412" y="154" font-size="14" opacity="0.54">research</text>
    <text x="730" y="258" font-size="14" opacity="0.54">operations</text>
    <text x="940" y="96" font-size="14" opacity="0.54">creative tools</text>
    <text x="76" y="300" font-size="20" font-weight="650" opacity="0.92">Human infrastructure for the intelligence age</text>
